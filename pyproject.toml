[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsidian-vault"
version = "0.1.0"
description = "Agent CLI for reading and safely editing local Obsidian Markdown vaults."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Joseph Heupler"}]
dependencies = ["PyYAML>=6,<7"]

[project.urls]
Repository = "https://github.com/java-heapler/obsidian-mcp"

[project.scripts]
obsidian-vault = "obsidian_vault.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=7,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=obsidian_vault --cov-branch --cov-report=term-missing --cov-fail-under=100"
